<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wazn Logo Samples</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6efe1; --card:#fbf7ee; --ink:#2a2118; --muted:#6d5f4e; --line:#dccfb6; --gold:#a8792a; --goldsoft:#d9b877; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display:flex; flex-direction:column; gap: 14px; }
  .card h2 { font-size: 16px; margin: 0; display:flex; gap: 8px; align-items: baseline; }
  .card h2 .n { color: var(--gold); font-weight: 700; }
  .hero { height: 170px; display:grid; place-items:center; }
  .hero svg { width: 150px; height: 150px; }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap; }
  .icon { width: 64px; height: 64px; border-radius: 15px; overflow:hidden; box-shadow: 0 1px 3px rgba(42,33,24,.2); }
  .icon svg, .fav svg { width: 100%; height: 100%; display:block; }
  .fav { width: 20px; height: 20px; }
  .tab { display:flex; align-items:center; gap: 6px; background: #e8dfcd; border-radius: 8px 8px 0 0; padding: 6px 10px; font-size: 12px; }
  .header { display:flex; align-items:center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .header svg { width: 34px; height: 34px; }
  .header .word { font-size: 12px; font-weight: 600; letter-spacing: .2em; color: var(--muted); }
  .why { color: var(--muted); font-size: 13.5px; margin: 0; }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<main>
  <h1>Wazn logo samples</h1>
  <p class="lead">Six directions, each shown large, as a phone app icon, as a browser-tab icon, and in the app header. Pick one (or mix parts), and say what you'd change.</p>
  <div class="grid" id="grid"></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 1. Wordmark: وَزْن in ink with a thin gold rule beneath -->
    <symbol id="l1" viewBox="0 0 120 120">
      <text x="60" y="76" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="64" fill="var(--ink)" direction="rtl">وَزْن</text>
      <path d="M30 96 H90" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 92 L64 96 L60 100 L56 96 Z" fill="var(--gold)"/>
    </symbol>

    <!-- 2. Wax seal: gold disc, scalloped edge, وزن in the middle -->
    <symbol id="l2" viewBox="0 0 120 120">
      <g fill="var(--gold)">
        <circle cx="60" cy="60" r="50"/>
        <g id="bumps"></g>
      </g>
      <circle cx="60" cy="60" r="40" fill="none" stroke="#f3dfae" stroke-width="1.4" opacity=".8"/>
      <circle cx="60" cy="60" r="36" fill="none" stroke="#f3dfae" stroke-width=".8" stroke-dasharray="1.5 3" opacity=".8"/>
      <text x="60" y="73" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="38" fill="#fbf1d8" direction="rtl">وَزْن</text>
    </symbol>

    <!-- 3. Balance (mīzān): wazn means "weight"; و and ن on the pans, ز on the beam -->
    <symbol id="l3" viewBox="0 0 120 120">
      <g stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M60 34 V98"/>
        <path d="M44 100 H76"/>
        <path d="M24 38 H96"/>
      </g>
      <g stroke="var(--muted)" stroke-width="1.2" fill="none">
        <path d="M27 38 L11 70 M27 38 L43 70"/>
        <path d="M93 38 L77 70 M93 38 L109 70"/>
      </g>
      <path d="M8 70 Q27 84 46 70 Z" fill="var(--gold)"/>
      <path d="M74 70 Q93 84 112 70 Z" fill="var(--gold)"/>
      <text x="93" y="69" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="24" fill="var(--ink)">و</text>
      <text x="27" y="69" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="24" fill="var(--ink)">ن</text>
      <text x="60" y="28" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="26" fill="var(--gold)">ز</text>
    </symbol>

    <!-- 4. Root tiles: the three ink tiles from the Workshop, on a gold rule -->
    <symbol id="l4" viewBox="0 0 120 120">
      <g font-family="Amiri" font-weight="700" font-size="28" text-anchor="middle" fill="var(--paper)">
        <rect x="80" y="38" width="32" height="32" rx="7" fill="var(--ink)"/><text x="96" y="64">و</text>
        <rect x="44" y="38" width="32" height="32" rx="7" fill="var(--ink)"/><text x="60" y="64">ز</text>
        <rect x="8"  y="38" width="32" height="32" rx="7" fill="var(--ink)"/><text x="24" y="64">ن</text>
      </g>
      <path d="M8 84 H112" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>
      <g fill="var(--goldsoft)"><circle cx="24" cy="84" r="3.5"/><circle cx="60" cy="84" r="3.5"/><circle cx="96" cy="84" r="3.5"/></g>
    </symbol>

    <!-- 5. Eight-pointed star (khātam) framing وزن, manuscript ornament -->
    <symbol id="l5" viewBox="0 0 120 120">
      <g transform="translate(60 60)">
        <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
        <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="var(--gold)" stroke-width="2.5" transform="rotate(45)"/>
        <circle r="31" fill="var(--card)" stroke="var(--gold)" stroke-width="1"/>
      </g>
      <text x="60" y="72" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="32" fill="var(--ink)" direction="rtl">وَزْن</text>
    </symbol>

    <!-- 6. Pattern into word: faint ف ع ل above, solid وزن below, linked by a gold arc -->
    <symbol id="l6" viewBox="0 0 120 120">
      <text x="60" y="40" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="28" fill="var(--goldsoft)" direction="rtl">فَعْل</text>
      <path d="M53 52 L60 59 L67 52" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="102" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="40" fill="var(--ink)" direction="rtl">وَزْن</text>
    </symbol>
  </defs>
</svg>

<script>
  // Scalloped seal edge for sample 2
  const bumps = document.getElementById("bumps");
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", 60 + Math.cos(a) * 50); c.setAttribute("cy", 60 + Math.sin(a) * 50); c.setAttribute("r", 6);
    bumps.appendChild(c);
  }

  const samples = [
    { name: "Wordmark", why: "Just the name in Amiri, nothing else. Most manuscript-like and calm; reads instantly to Arabic readers, but it's small and plain as an app icon." },
    { name: "Wax seal", why: "The gold seal you earn for completing a root becomes the brand. Strong as an app icon and ties the logo to the reward." },
    { name: "Balance (mīzān)", why: "Wazn literally means weight. The letters sit on a scale, which shares the root idea with mīzān. Clever, but the letters get small at icon size." },
    { name: "Root tiles", why: "The three ink root tiles from the Workshop. The logo is the app's core action; non-Arabic readers see 'three letters' immediately." },
    { name: "Eight-pointed star", why: "A classic Islamic geometric frame around the name. Very manuscript, very ornamental; risks looking traditional rather than playful." },
    { name: "Pattern into word", why: "ف ع ل turning into وزن: the whole idea of the app in one mark. Best as a header/hero logo; too detailed for a tab icon." },
  ];
  const svg = (id, bg) => `<svg viewBox="0 0 120 120" role="img" aria-label="Wazn logo">${bg ? `<rect width="120" height="120" fill="${bg}"/>` : ""}<use href="#${id}"/></svg>`;
  document.getElementById("grid").innerHTML = samples.map((s, i) => `
    <section class="card">
      <h2><span class="n">${i + 1}</span>${s.name}</h2>
      <div class="hero">${svg("l" + (i + 1))}</div>
      <div class="row">
        <div><div class="lbl">App icon</div><div class="icon">${svg("l" + (i + 1), "#f6efe1")}</div></div>
        <div><div class="lbl">Browser tab</div><div class="tab"><span class="fav">${svg("l" + (i + 1))}</span>Wazn · وَزْن</div></div>
      </div>
      <div class="header">${svg("l" + (i + 1))}<span class="word">WAZN</span></div>
      <p class="why">${s.why}</p>
    </section>`).join("");
</script>
</body>
</html>
