<!doctype html>
<!-- Source for Wazn's icons (the wax seal, logo option 2). Rendered to PNG with a headless browser:
     msedge --headless --screenshot=public/icon-512.png --window-size=512,512 --virtual-time-budget=3000
       --default-background-color=00000000 "file:///.../seal-icon.html?bg=1"
     ?bg=1 puts the seal on a paper square (home-screen icons); without it the corners are transparent (tab icon).
     favicon.png: 64px, no bg. icon-512.png: 512px with bg. apple-touch-icon.png (180) and icon-192.png were
     downscaled from icon-512.png, because headless Edge renders tiny windows incorrectly. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Amiri; font-weight: 700; src: url("../../node_modules/@fontsource/amiri/files/amiri-arabic-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 120 120" id="seal">
  <rect id="bg" width="120" height="120" fill="#f6efe1" visibility="hidden"/>
  <g id="disc" fill="#a8792a"><circle cx="60" cy="60" r="50"/></g>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#f3dfae" stroke-width="1.6" opacity=".85"/>
  <circle cx="60" cy="60" r="35.5" fill="none" stroke="#f3dfae" stroke-width="1" stroke-dasharray="1.6 3.2" opacity=".85"/>
  <text x="60" y="74" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="40" fill="#fbf1d8" direction="rtl">وَزْن</text>
</svg>
<script>
  const params = new URLSearchParams(location.search);
  const svg = document.getElementById("seal");
  // On a paper square the seal is inset so it survives rounded/circular home-screen masks.
  if (params.has("bg")) {
    document.getElementById("bg").setAttribute("visibility", "visible");
    svg.setAttribute("viewBox", "-14 -14 148 148");
    document.getElementById("bg").setAttribute("x", "-14");
    document.getElementById("bg").setAttribute("y", "-14");
    document.getElementById("bg").setAttribute("width", "148");
    document.getElementById("bg").setAttribute("height", "148");
  } else {
    svg.setAttribute("viewBox", "3 3 114 114");
  }
  // Scalloped wax edge
  const disc = document.getElementById("disc");
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", 60 + Math.cos(a) * 50);
    c.setAttribute("cy", 60 + Math.sin(a) * 50);
    c.setAttribute("r", 6);
    disc.appendChild(c);
  }
</script>
</body>
</html>
